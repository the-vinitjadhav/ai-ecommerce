<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=4">
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .auth-body { padding: 40px; }
        .form-control {
            border-radius: 12px;
            padding: 12px 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            border-color: #6366f1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="auth-card">
                    <div class="auth-header">
                        <h3 class="fw-bold mb-0">Welcome Back</h3>
                        <p class="mb-0 text-white-50">Sign in to sync your AI agent memory.</p>
                    </div>
                    <div class="auth-body">
                        <div id="login-alert" class="alert alert-danger d-none rounded-pill"></div>
                        
                        <form id="login-form">
                            <div class="mb-4">
                                <label for="email" class="form-label fw-bold text-muted small">Email Address</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-bold text-muted small">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold fs-6 shadow-glow" style="background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); border:none;">Access Account</button>
                        </form>
                        <div class="text-center mt-4">
                            <a href="register.html" class="text-decoration-none fw-bold" style="color: #6366f1;">Don't have an account? Register</a>
                        </div>
                        <div class="text-center mt-3">
                            <a href="index.html" class="text-muted small text-decoration-none">← Return to Store</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="ai-chat-widget-container"></div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/widget-chat.js"></script>
</body>
</html>
