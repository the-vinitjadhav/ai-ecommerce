<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=4">
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px 0;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .auth-body { padding: 40px; }
        .form-control {
            border-radius: 12px;
            padding: 12px 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="auth-card">
                    <div class="auth-header">
                        <h3 class="fw-bold mb-0">Join AI Store</h3>
                        <p class="mb-0 text-white-50">Create your personalized shopping profile.</p>
                    </div>
                    <div class="auth-body">
                        <div id="register-alert" class="alert alert-danger d-none rounded-pill"></div>
                        
                        <form id="register-form">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label fw-bold text-muted small">Full Name</label>
                                    <input type="text" class="form-control" id="name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label fw-bold text-muted small">Email Address</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label fw-bold text-muted small">Password</label>
                                    <input type="password" class="form-control" id="password" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label fw-bold text-muted small">Phone Number</label>
                                    <input type="text" class="form-control" id="phone">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="address" class="form-label fw-bold text-muted small">Delivery Address</label>
                                <input type="text" class="form-control" id="address">
                            </div>
                            <div class="row mb-4">
                                <div class="col-md-6 mb-3">
                                    <label for="city" class="form-label fw-bold text-muted small">City</label>
                                    <input type="text" class="form-control" id="city">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="pincode" class="form-label fw-bold text-muted small">Pincode / ZIP</label>
                                    <input type="text" class="form-control" id="pincode">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100 rounded-pill py-3 fw-bold fs-6" style="background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%); border:none;">Create Account</button>
                        </form>
                        <div class="text-center mt-4">
                            <a href="login.html" class="text-decoration-none fw-bold" style="color: #3b82f6;">Already have an account? Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
